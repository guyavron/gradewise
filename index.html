<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeWise — מחשבון ממוצע אקדמי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Heebo', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'Consolas', 'Courier New', 'monospace']
        },
        colors: {
          ink: '#0d1420',
          panel: '#161f30',
          panel2: '#111a2c',
          line: '#253150',
          ink2: '#e8ecf5',
          muted: '#7c8bab',
          accent: '#4ee3c2',
          accentBg: '#0f2b26'
        }
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Heebo', ui-sans-serif, system-ui, sans-serif; }
  input[type=checkbox] { accent-color: #4ee3c2; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #253150; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #35426a; }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .chip-active { background-color: #4ee3c2 !important; color: #07231d !important; border-color: #4ee3c2 !important; }
</style>
</head>
<body class="bg-ink text-ink2 min-h-screen">

<div id="import-modal" class="hidden fixed inset-0 z-40 bg-ink overflow-y-auto" role="dialog" aria-modal="true"></div>

<div id="toast-root" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24">

  <!-- Header -->
  <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-accent text-[#07231d] flex items-center justify-center text-sm font-mono font-bold">GW</div>
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold leading-tight">
          <span class="text-accent">Grade</span><span class="text-ink2">Wise</span>
        </h1>
        <p class="text-xs sm:text-sm text-muted">ניהול ציונים, קורסים וממוצעים לאורך התואר</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <input type="file" id="import-file-input" accept="application/json" class="hidden" />
      <input type="file" id="screenshot-input" accept="image/*" multiple class="hidden" />
      <button data-action="import-screenshot" class="text-xs sm:text-sm font-semibold text-accent border border-accent/50 hover:bg-accentBg/40 rounded-xl px-3 py-2 transition-colors">
        ייבוא מצילום מסך
      </button>
      <button data-action="export-backup" class="text-xs sm:text-sm font-medium text-muted hover:text-accent border border-line hover:border-accent/50 hover:bg-accentBg/30 rounded-xl px-3 py-2 transition-colors">
        ייצוא גיבוי
      </button>
      <button data-action="import-backup" class="text-xs sm:text-sm font-medium text-muted hover:text-accent border border-line hover:border-accent/50 hover:bg-accentBg/30 rounded-xl px-3 py-2 transition-colors">
        ייבוא גיבוי
      </button>
      <button data-action="reset-all" class="text-xs sm:text-sm font-medium text-muted hover:text-red-400 border border-line hover:border-red-800 hover:bg-red-950/30 rounded-xl px-3 py-2 transition-colors">
        אפס הכל
      </button>
    </div>
  </header>

  <!-- In-app browser warning (shown by checkInAppBrowser) -->
  <div id="inapp-warning" class="hidden mb-6 border border-amber-700/60 bg-amber-950/40 text-amber-200 rounded-2xl p-4 text-sm">
    <div class="flex items-start justify-between gap-3">
      <p>נראה שפתחתם את GradeWise מתוך אפליקציה (כמו אינסטגרם או וואטסאפ). דפדפן פנימי לא תמיד שומר את הנתונים — כדי שהציונים יישמרו, פתחו את הקישור בספארי או בכרום.</p>
      <button data-action="dismiss-inapp" class="shrink-0 text-amber-300 hover:text-amber-100" aria-label="סגירה">✕</button>
    </div>
  </div>

  <!-- Dashboard -->
  <section id="dashboard" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6"></section>

  <!-- Binary recommendation -->
  <section id="recommendation" class="mb-6"></section>

  <!-- Filter bar -->
  <section id="filter-bar" class="mb-6"></section>

  <!-- Course tree -->
  <main id="years-root" class="space-y-6"></main>

  <!-- Add year button -->
  <div class="mt-6">
    <button data-action="add-year" class="w-full border-2 border-dashed border-line hover:border-accent/50 hover:bg-accentBg/40 text-muted hover:text-accent rounded-2xl py-4 font-semibold transition-colors flex items-center justify-center gap-2">
      <span class="text-lg leading-none">+</span> הוספת שנת לימודים
    </button>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     STATE
  ============================================================ */
  const HEBREW_ORDINALS = ["א","ב","ג","ד","ה","ו","ז","ח","ט","י","יא","יב","יג","יד","טו"];

  const state = {
    years: [],
    filter: { mode: "all", yearId: null, semesterId: null } // mode: all | year | semester
  };

  const STORAGE_KEY = "gradewise-state-v1";

  // Auto-saves to this browser only (localStorage) — no accounts, no server.
  // Each browser/device has its own independent copy; nothing is shared or synced.
  function persistState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ years: state.years, filter: state.filter }));
    } catch (e) {
      // Storage unavailable (private browsing, quota, etc.) — fail silently, app still works in-memory
    }
  }

  function loadPersistedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.years)) return false;
      state.years = parsed.years;
      if (parsed.filter) state.filter = parsed.filter;
      return state.years.length > 0;
    } catch (e) {
      return false;
    }
  }

  function uid() {
    return "id-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function ordinalYearName(index) {
    const letter = HEBREW_ORDINALS[index] || (index + 1);
    return "שנה " + letter + (HEBREW_ORDINALS[index] ? "׳" : "");
  }

  function nextSemesterName(count) {
    if (count === 0) return "סמסטר א׳";
    if (count === 1) return "סמסטר ב׳";
    if (count === 2) return "סמסטר קיץ";
    return "סמסטר נוסף " + (count - 1);
  }

  /* ============================================================
     LOOKUPS
  ============================================================ */
  function findYear(yearId) {
    return state.years.find(y => y.id === yearId) || null;
  }

  function locateSemester(semesterId) {
    for (const year of state.years) {
      const semester = year.semesters.find(s => s.id === semesterId);
      if (semester) return { year, semester };
    }
    return { year: null, semester: null };
  }

  function locateCourse(courseId) {
    for (const year of state.years) {
      for (const semester of year.semesters) {
        const course = semester.courses.find(c => c.id === courseId);
        if (course) return { year, semester, course };
      }
    }
    return { year: null, semester: null, course: null };
  }

  function allCourses() {
    const list = [];
    state.years.forEach(y => y.semesters.forEach(s => list.push(...s.courses)));
    return list;
  }

  /* ============================================================
     MUTATIONS
  ============================================================ */
  function addYear() {
    state.years.push({ id: uid(), name: ordinalYearName(state.years.length), semesters: [] });
    render();
  }

  function deleteYear(yearId) {
    if (!confirm("למחוק את השנה כולה, כולל כל הסמסטרים והקורסים שבתוכה?")) return;
    state.years = state.years.filter(y => y.id !== yearId);
    if (state.filter.yearId === yearId) resetFilter();
    render();
  }

  function addSemester(yearId) {
    const year = findYear(yearId);
    if (!year) return;
    year.semesters.push({ id: uid(), name: nextSemesterName(year.semesters.length), courses: [] });
    render();
  }

  function deleteSemester(semesterId) {
    if (!confirm("למחוק את הסמסטר וכל הקורסים שבתוכו?")) return;
    const { year } = locateSemester(semesterId);
    if (!year) return;
    year.semesters = year.semesters.filter(s => s.id !== semesterId);
    if (state.filter.semesterId === semesterId) resetFilter();
    render();
  }

  function addCourse(semesterId) {
    const { semester } = locateSemester(semesterId);
    if (!semester) return;
    semester.courses.push({
      id: uid(),
      name: "קורס חדש",
      credits: 3,
      isBinary: false,
      bonusPoints: 0,
      expanded: true,
      components: [
        { id: uid(), type: "exam", name: "מבחן סופי", weight: 100, grade: "", isMagen: false }
      ]
    });
    render();
  }

  function deleteCourse(courseId) {
    if (!confirm("למחוק את הקורס?")) return;
    const { semester } = locateCourse(courseId);
    if (!semester) return;
    semester.courses = semester.courses.filter(c => c.id !== courseId);
    render();
  }

  function toggleCourseExpanded(courseId) {
    const { course } = locateCourse(courseId);
    if (!course) return;
    course.expanded = !course.expanded;
    render();
  }

  function addComponent(courseId, type) {
    const { course } = locateCourse(courseId);
    if (!course) return;
    course.components.push({
      id: uid(),
      type,
      name: type === "quiz" ? "בוחן" : "עבודה",
      weight: 0,
      grade: "",
      isMagen: false
    });
    render();
  }

  function deleteComponent(courseId, componentId) {
    const { course } = locateCourse(courseId);
    if (!course) return;
    course.components = course.components.filter(c => c.id !== componentId);
    render();
  }

  function resetFilter() {
    state.filter = { mode: "all", yearId: null, semesterId: null };
  }

  function resetAll() {
    if (!confirm("לאפס את כל הנתונים? הפעולה אינה הפיכה.")) return;
    state.years = [];
    resetFilter();
    persistState();
    render();
    showToast("כל הנתונים אופסו");
  }

  function applyRecommendation(courseId) {
    const { course } = locateCourse(courseId);
    if (!course) return;
    course.isBinary = true;
    render();
    showToast(`"${course.name}" סומן כעובר בינארי`);
  }

  // Demo data — lets a first-time visitor (or a recruiter) see every feature
  // without typing grades. All names and grades are fictional. Built fresh on
  // every call so each object gets its own uid().
  function buildDemoYears() {
    const exam = (grade, weight) => ({ id: uid(), type: "exam", name: "מבחן סופי", weight, grade, isMagen: false });
    const quiz = (name, grade, weight, isMagen) => ({ id: uid(), type: "quiz", name, weight, grade, isMagen });
    const task = (name, grade, weight, isMagen) => ({ id: uid(), type: "assignment", name, weight, grade, isMagen });
    const course = (name, credits, components, extra = {}) => ({
      id: uid(), name, credits, isBinary: false, bonusPoints: 0, expanded: false, components, ...extra
    });
    const semester = (index, courses) => ({ id: uid(), name: nextSemesterName(index), courses });
    const year = (index, semesters) => ({ id: uid(), name: ordinalYearName(index), semesters });

    return [
      year(0, [
        semester(0, [
          // Magen quiz beats the exam (92 > 84), so it counts
          course('חדו"א 1', 5, [quiz("בוחן אמצע", 92, 15, true), exam(84, 85)]),
          course("מבוא לתכנות", 4, [task("פרויקט", 95, 30, false), exam(81, 70)]),
          course("מבוא לכלכלה", 3.5, [exam(88, 100)]),
          course("סדנת מיומנויות למידה", 1, [exam("", 100)], { isBinary: true })
        ]),
        semester(1, [
          // Magen quiz is lower than the exam (70 < 78), so it is dropped and its
          // weight is redistributed — expanded so the "not included" label is visible
          course('חדו"א 2', 5, [quiz("בוחן אמצע", 70, 20, true), exam(78, 80)], { expanded: true }),
          // Low grade on a high-credit course → triggers the pass/fail recommendation
          course("פיזיקה 1", 4, [exam(64, 100)]),
          course("סטטיסטיקה 1", 4, [task("תרגילי בית", 90, 20, false), exam(86, 80)])
        ])
      ]),
      year(1, [
        semester(0, [
          // Current semester: final exams not taken yet → shows the "ungraded" state
          course("חקר ביצועים 1", 4, [task("עבודה", 93, 25, false), exam("", 75)]),
          course("מערכות מידע", 3, [task("פרויקט", 96, 40, false), exam("", 60)])
        ])
      ])
    ];
  }

  function loadDemoData() {
    // Only offered on the empty state, so there is never user data to overwrite
    if (state.years.length > 0) return;
    state.years = buildDemoYears();
    resetFilter();
    render();
    showToast('נטענו נתוני דמו — "אפס הכל" כדי להתחיל מאפס');
  }

  // Manual backup/restore — a safety net independent of localStorage, since
  // browser storage isn't guaranteed to survive indefinitely (e.g. iOS is known
  // to evict site storage more aggressively than desktop browsers).
  function exportBackup() {
    const payload = { years: state.years, filter: state.filter, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gradewise-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("קובץ הגיבוי הורד");
  }

  function importBackupFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        showToast("קובץ לא תקין");
        return;
      }
      if (!parsed || !Array.isArray(parsed.years)) {
        showToast("קובץ לא תקין");
        return;
      }
      if (!confirm("ייבוא הגיבוי יחליף את כל הנתונים הנוכחיים. להמשיך?")) return;
      state.years = parsed.years;
      if (parsed.filter) state.filter = parsed.filter; else resetFilter();
      render();
      showToast("הגיבוי יובא בהצלחה");
    };
    reader.readAsText(file);
  }

  /* ============================================================
     SCREENSHOT IMPORT (OCR)
     Reads a screenshot of the BGU grades screen and turns it into
     courses. Everything runs in the browser: the image never leaves
     the device. Pipeline:
       1. analyzeLayout()  — find the colored grade/credits boxes by color
       2. readScreenshot() — OCR each box separately (digits only) and the
                             course name next to it
       3. review modal     — the user checks/fixes every value, then imports
  ============================================================ */
  const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  const ANALYSIS_WIDTH = 940;          // every screenshot is scaled to this width, so pixel thresholds are device-independent
  const TERMS = ["א", "ב", "קיץ"];     // index = semester index used by nextSemesterName()
  let ocrWorkers = null;               // created once, on first use (lazy loading)
  let importDraft = null;              // { status, shots: [...] } while the review modal is open

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("script load failed"));
      document.head.appendChild(s);
    });
  }

  // Two OCR workers: one for Hebrew text (course names, title, "עובר") and a
  // separate English-only one for numbers. With the Hebrew model loaded, digit
  // reads were noticeably worse (e.g. "85.00" read as "0"); English-only with
  // PSM 13 ("raw line") was the most reliable in testing.
  async function getOcrWorkers(onStatus) {
    if (ocrWorkers) return ocrWorkers;
    if (!window.Tesseract) {
      onStatus("טוען את מנוע זיהוי הטקסט (פעם אחת בלבד)…");
      await loadScript(TESSERACT_URL);
    }
    onStatus("טוען מודל לזיהוי עברית…");
    const text = await Tesseract.createWorker(["heb", "eng"]);
    await text.setParameters({ tessedit_pageseg_mode: "6" });          // 6 = a block of text
    const digits = await Tesseract.createWorker("eng");
    await digits.setParameters({ tessedit_char_whitelist: "0123456789.", tessedit_pageseg_mode: "13" }); // 13 = one raw line
    ocrWorkers = { text, digits };
    return ocrWorkers;
  }

  async function ocrText(canvas, { digitsOnly = false } = {}) {
    const worker = digitsOnly ? ocrWorkers.digits : ocrWorkers.text;
    const { data } = await worker.recognize(canvas);
    return data.text.replace(/[\u200e\u200f]/g, "").replace(/\s+/g, " ").trim();
  }

  // Returns two canvases: "full" is the screenshot at its original resolution
  // (all text is read from it), "small" is scaled to ANALYSIS_WIDTH (only used
  // to find the layout, so pixel thresholds are the same on every phone).
  // f = how many original pixels one "small" pixel is.
  function fileToCanvas(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const full = document.createElement("canvas");
        full.width = img.naturalWidth;
        full.height = img.naturalHeight;
        full.getContext("2d").drawImage(img, 0, 0);
        const small = document.createElement("canvas");
        small.width = ANALYSIS_WIDTH;
        small.height = Math.round(img.naturalHeight * (ANALYSIS_WIDTH / img.naturalWidth));
        small.getContext("2d").drawImage(img, 0, 0, small.width, small.height);
        URL.revokeObjectURL(url);
        resolve({ full, small, f: img.naturalWidth / ANALYSIS_WIDTH });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  function cropCanvas(src, x0, y0, x1, y1) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(x1 - x0));
    c.height = Math.max(1, Math.round(y1 - y0));
    c.getContext("2d").drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    return c;
  }

  // White text on an orange/blue box is hard for OCR. This turns a box into
  // black text on white: take each pixel's lightness (white text is light on
  // all three channels, the colored box is not), resize it to a fixed height
  // with our own bilinear interpolation, apply a threshold, add a margin.
  // Resizing is done here in plain JS on purpose: the browser's built-in canvas
  // smoothing differs between Chrome and Safari, and on an iPhone that turned
  // "88.00" into "38.00". Doing it ourselves gives the same pixels everywhere.
  // r = box in "small" coordinates; img = { full, f }.
  function boxToCanvas(img, r, threshold = 150) {
    const sx = Math.round(r.x0 * img.f), sy = Math.round(r.y0 * img.f);
    const sw = Math.max(2, Math.round((r.x1 - r.x0) * img.f)), sh = Math.max(2, Math.round((r.y1 - r.y0) * img.f));
    const src = img.full.getContext("2d").getImageData(sx, sy, sw, sh).data;
    const light = new Float32Array(sw * sh);
    for (let i = 0; i < sw * sh; i++) light[i] = Math.min(src[i * 4], src[i * 4 + 1], src[i * 4 + 2]);

    const outH = Math.round((r.y1 - r.y0) * 2), scale = outH / sh, outW = Math.round(sw * scale), P = 20;
    const out = document.createElement("canvas");
    out.width = outW + 2 * P;
    out.height = outH + 2 * P;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    const dst = ctx.getImageData(P, P, outW, outH), d = dst.data;
    for (let y = 0; y < outH; y++) {
      const fy = Math.min(sh - 1, (y + 0.5) / scale - 0.5), y0 = Math.max(0, Math.floor(fy)), y1 = Math.min(sh - 1, y0 + 1), ty = Math.max(0, fy - y0);
      for (let x = 0; x < outW; x++) {
        const fx = Math.min(sw - 1, (x + 0.5) / scale - 0.5), x0 = Math.max(0, Math.floor(fx)), x1 = Math.min(sw - 1, x0 + 1), tx = Math.max(0, fx - x0);
        const v = (light[y0 * sw + x0] * (1 - tx) + light[y0 * sw + x1] * tx) * (1 - ty)
                + (light[y1 * sw + x0] * (1 - tx) + light[y1 * sw + x1] * tx) * ty;
        const o = (y * outW + x) * 4, ink = v > threshold ? 0 : 255;
        d[o] = d[o + 1] = d[o + 2] = ink;
        d[o + 3] = 255;
      }
    }
    ctx.putImageData(dst, P, P);
    return out;
  }

  // Crops a rectangle given in "small" coordinates out of the full-resolution image (1:1, no resizing).
  function cropFull(img, r) {
    return cropCanvas(img.full, r.x0 * img.f, r.y0 * img.f, r.x1 * img.f, r.y1 * img.f);
  }

  // Finds every course on the screenshot without OCR, using color only:
  // grade boxes are blue, credits boxes are orange, both sit on the left half.
  // Full-width orange bars (status bar, section headers) are ignored because
  // they also have colored pixels on the right half.
  function analyzeLayout(canvas) {
    const W = canvas.width, H = canvas.height, half = Math.floor(W / 2);
    const d = canvas.getContext("2d").getImageData(0, 0, W, H).data;

    const bands = [];
    for (let y = 0; y < H; y++) {
      let left = 0, right = 0, blue = 0, minX = W, maxX = -1;
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        if (Math.max(r, g, b) - Math.min(r, g, b) <= 90) continue; // not a strong color
        if (x < half) {
          left++;
          if (b > r) blue++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        } else {
          right++;
        }
      }
      if (left < W * 0.12 || right > W * 0.02) continue; // not a box row
      const kind = blue > left / 2 ? "grade" : "credits";
      const last = bands[bands.length - 1];
      if (last && last.kind === kind && y - last.y1 <= 3) {
        last.y1 = y;
        last.x0 = Math.min(last.x0, minX);
        last.x1 = Math.max(last.x1, maxX);
      } else {
        bands.push({ kind, y0: y, y1: y, x0: minX, x1: maxX });
      }
    }
    const boxes = bands.filter(b => b.y1 - b.y0 >= 15);

    // A course = a blue grade box directly on top of an orange credits box,
    // or a credits box alone (current semester, no grade yet).
    const courses = [];
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i], next = boxes[i + 1];
      if (b.kind === "grade" && next && next.kind === "credits" && next.y0 - b.y1 <= 8) {
        courses.push({ grade: b, credits: next });
        i++;
      } else {
        courses.push(b.kind === "grade" ? { grade: b, credits: null } : { grade: null, credits: b });
      }
    }

    // Each course sits on a white card; the name is to the right of the boxes.
    // The card's height is measured in the thin white margin LEFT of the boxes,
    // where there is never any text (a probe on the right side hits long names).
    const probeX = boxes.length ? Math.max(0, Math.min(...boxes.map(b => b.x0)) - 8) : 0;
    const isWhite = y => {
      const i = (y * W + probeX) * 4;
      return Math.min(d[i], d[i + 1], d[i + 2]) >= 250;
    };
    courses.forEach(c => {
      const top = (c.grade || c.credits).y0, bottom = (c.credits || c.grade).y1;
      let y0 = top, y1 = bottom;
      while (y0 > 0 && isWhite(y0 - 1)) y0--;
      while (y1 < H - 1 && isWhite(y1 + 1)) y1++;
      const boxRight = Math.max(c.grade ? c.grade.x1 : 0, c.credits ? c.credits.x1 : 0);
      c.name = { x0: boxRight + 12, y0, x1: Math.round(W * 0.96), y1: y1 + 1 };
    });

    const titleBottom = boxes.length ? Math.max(0, boxes[0].y0 - 10) : Math.round(H * 0.3);
    return { courses, title: { x0: 0, y0: 0, x1: W, y1: titleBottom } };
  }

  // "85.00", "8500", "4.50" → number. Returns null if there's no number.
  function parseOcrNumber(text) {
    const m = text.replace(/\s/g, "").match(/(\d{1,3})\.?(\d{2})/);
    return m ? Number(m[1] + "." + m[2]) : null;
  }

  // OCR can misread a digit (8 → 3) and still return a clean-looking number.
  // So every number is read several times with different preprocessing, and a
  // value is accepted only if at least two reads agree on it and no other value
  // gets as many votes. Otherwise we return null and the field is flagged for
  // the user. Rule: never guess silently — flag instead.
  async function readNumberVotes(img, rects, thresholds, isValid) {
    const votes = new Map();
    for (const r of rects) {
      for (const t of thresholds) {
        const value = parseOcrNumber(await ocrText(boxToCanvas(img, r, t), { digitsOnly: true }));
        if (value !== null && isValid(value)) votes.set(value, (votes.get(value) || 0) + 1);
      }
    }
    const ranked = [...votes.entries()].sort((a, b) => b[1] - a[1]);
    if (!ranked.length || ranked[0][1] < 2) return null;
    if (ranked[1] && ranked[1][1] === ranked[0][1]) return null; // a tie = not sure
    return ranked[0][0];
  }

  async function readGrade(img, box) {
    const r = { x0: box.x0 + 12, y0: box.y0 + 4, x1: box.x1 - 12, y1: box.y1 - 4 };
    return readNumberVotes(img, [r], [100, 120, 150, 180, 200], v => v >= 0 && v <= 100);
  }

  // The credits box reads "4.50 נק״ז": the number is on the right and the
  // Hebrew letters on the left, and only the number should be read. A fixed
  // cut point failed when the number's width changed ("0.00" vs "4.50"), so we
  // find the real gap: scan the box column by column, mark columns that contain
  // white text, and cut in the middle of the widest empty run of columns —
  // the space between the letters and the number is wider than any gap between
  // digits. Returns an x position in "small" coordinates, or null.
  function findCreditsCut(img, box) {
    const sx = Math.round(box.x0 * img.f), sy = Math.round((box.y0 + 4) * img.f);
    const sw = Math.round((box.x1 - box.x0) * img.f), sh = Math.round((box.y1 - box.y0 - 8) * img.f);
    const d = img.full.getContext("2d").getImageData(sx, sy, sw, sh).data;
    const margin = Math.round(sw * 0.05);
    let best = null, runStart = null;
    for (let x = margin; x < sw - margin; x++) {
      let ink = false;
      for (let y = 0; y < sh && !ink; y++) {
        const i = (y * sw + x) * 4;
        if (Math.min(d[i], d[i + 1], d[i + 2]) > 200) ink = true;
      }
      if (!ink && runStart === null) runStart = x;
      if (ink && runStart !== null) {
        if (runStart > margin && (!best || x - runStart > best.len)) best = { start: runStart, len: x - runStart };
        runStart = null;
      }
    }
    if (!best) return null;
    return box.x0 + (best.start + best.len / 2) / img.f;
  }

  async function readCredits(img, box) {
    const w = box.x1 - box.x0, gap = findCreditsCut(img, box);
    const cuts = gap !== null ? [gap] : [box.x0 + w * 0.47, box.x0 + w * 0.52];
    const rects = cuts.map(x0 => ({ x0, y0: box.y0 + 4, x1: box.x1 - 12, y1: box.y1 - 4 }));
    return readNumberVotes(img, rects, [100, 120, 150, 180, 200], v => v <= 15);
  }

  async function readScreenshot(file) {
    const img = await fileToCanvas(file);
    const layout = analyzeLayout(img.small);

    const titleText = await ocrText(cropFull(img, layout.title));
    // Hebrew OCR sometimes returns the RTL title in reversed order
    // ("סמסטר א 2026" instead of "2026 סמסטר א"), so both orders are accepted.
    const tm = titleText.match(/(20\d{2})[^]*?סמסטר\s*(א|ב|קיץ)/) || titleText.match(/סמסטר\s*(א|ב|קיץ)[^]*?(20\d{2})/);
    const calYear = tm ? Number(/^20\d{2}$/.test(tm[1]) ? tm[1] : tm[2]) : null;
    const term = tm ? (/^20\d{2}$/.test(tm[1]) ? tm[2] : tm[1]) : null;
    const shot = {
      fileName: file.name,
      calYear,
      termIndex: term ? TERMS.indexOf(term) : 0,
      yearIndex: 0,
      rows: []
    };

    for (const c of layout.courses) {
      const name = await ocrText(cropFull(img, c.name));
      const row = { include: true, name, grade: "", isBinary: false, credits: "", flags: {} };

      if (c.grade) {
        const value = await readGrade(img, c.grade);
        if (value !== null) {
          row.grade = value;
        } else if ((await ocrText(boxToCanvas(img, { x0: c.grade.x0 + 12, y0: c.grade.y0 + 4, x1: c.grade.x1 - 12, y1: c.grade.y1 - 4 }))).includes("עובר")) {
          row.isBinary = true;
        } else {
          row.flags.grade = true;
        }
      }
      if (c.credits) {
        const value = await readCredits(img, c.credits);
        if (value !== null) row.credits = value;
        else row.flags.credits = true;
      } else {
        row.flags.credits = true;
      }
      if (!row.name) row.flags.name = true;
      if (row.credits === 0) row.include = false; // 0-credit courses don't affect anything — skipped by default
      shot.rows.push(row);
    }
    return shot;
  }

  // Which study year (שנה א׳, ב׳…) does a calendar year like 2026 belong to?
  // If an earlier import already linked a year, count from it; otherwise the
  // earliest year in this batch is treated as the first year we know of.
  function guessYearIndex(calYear, batchYears) {
    if (!calYear) return Math.max(0, state.years.length - 1);
    const anchor = state.years.findIndex(y => y.academicYear);
    if (anchor >= 0) return Math.max(0, anchor + (calYear - state.years[anchor].academicYear));
    return calYear - Math.min(...batchYears);
  }

  function normalizeName(s) {
    return String(s).replace(/["'״׳]/g, "").replace(/\s+/g, " ").trim();
  }

  function existingSemester(yearIndex, termIndex) {
    const year = state.years[yearIndex];
    if (!year) return null;
    return year.semesters.find(s => s.name === nextSemesterName(termIndex)) || null;
  }

  function markDuplicates(shot) {
    const sem = existingSemester(shot.yearIndex, shot.termIndex);
    const names = new Set((sem ? sem.courses : []).map(c => normalizeName(c.name)));
    shot.rows.forEach(r => {
      r.duplicate = names.has(normalizeName(r.name));
    });
  }

  async function startScreenshotImport(files) {
    if (!files.length) return;
    importDraft = { status: "מתחיל…", shots: [] };
    renderImportModal();
    const setStatus = msg => { importDraft.status = msg; renderImportModal(); };
    try {
      await getOcrWorkers(setStatus);
      for (let i = 0; i < files.length; i++) {
        setStatus(files.length > 1 ? `מזהה צילום ${i + 1} מתוך ${files.length}…` : "מזהה את הציונים…");
        importDraft.shots.push(await readScreenshot(files[i]));
      }
    } catch (err) {
      closeImportModal();
      showToast("לא הצלחתי לטעון את מנוע הזיהוי. בדקו את החיבור לאינטרנט ונסו שוב");
      return;
    }
    const batchYears = importDraft.shots.map(s => s.calYear).filter(Boolean);
    importDraft.shots.forEach(s => {
      s.yearIndex = guessYearIndex(s.calYear, batchYears);
      markDuplicates(s);
      s.rows.forEach(r => { if (r.duplicate) r.include = false; });
    });
    importDraft.status = null;
    renderImportModal();
  }

  function ensureSemester(yearIndex, termIndex, calYear) {
    while (state.years.length <= yearIndex) {
      state.years.push({ id: uid(), name: ordinalYearName(state.years.length), semesters: [] });
    }
    const year = state.years[yearIndex];
    if (calYear && !year.academicYear) year.academicYear = calYear;
    let sem = existingSemester(yearIndex, termIndex);
    if (!sem) {
      sem = { id: uid(), name: nextSemesterName(termIndex), courses: [] };
      year.semesters.push(sem);
      const order = name => {
        const i = [0, 1, 2].findIndex(t => nextSemesterName(t) === name);
        return i < 0 ? 99 : i;
      };
      year.semesters.sort((a, b) => order(a.name) - order(b.name));
    }
    return sem;
  }

  function confirmScreenshotImport() {
    let count = 0;
    importDraft.shots.forEach(shot => {
      const rows = shot.rows.filter(r => r.include && String(r.name).trim());
      if (!rows.length) return;
      const sem = ensureSemester(shot.yearIndex, shot.termIndex, shot.calYear);
      rows.forEach(r => {
        sem.courses.push({
          id: uid(),
          name: String(r.name).trim(),
          credits: r.credits === "" ? 0 : Number(r.credits),
          isBinary: r.isBinary,
          bonusPoints: 0,
          expanded: false,
          components: [{
            id: uid(), type: "exam", name: "ציון סופי", weight: 100,
            grade: r.isBinary || r.grade === "" ? "" : Number(r.grade), isMagen: false
          }]
        });
        count++;
      });
    });
    closeImportModal();
    render();
    showToast(count ? `יובאו ${count} קורסים` : "לא נבחרו קורסים לייבוא");
  }

  function closeImportModal() {
    importDraft = null;
    renderImportModal();
  }

  function renderImportModal() {
    const root = document.getElementById("import-modal");
    if (!importDraft) {
      root.classList.add("hidden");
      root.innerHTML = "";
      document.body.style.overflow = "";
      return;
    }
    root.classList.remove("hidden");
    document.body.style.overflow = "hidden";

    if (importDraft.status) {
      root.innerHTML = `
        <div class="min-h-full flex items-center justify-center p-4">
          <div class="bg-panel border border-line rounded-2xl p-6 w-full max-w-sm text-center">
            <div class="w-8 h-8 mx-auto mb-4 rounded-full border-2 border-line border-t-accent animate-spin"></div>
            <p class="text-ink2 font-medium">${esc(importDraft.status)}</p>
            <p class="text-muted text-xs mt-2">הזיהוי רץ על המכשיר שלכם — התמונה לא נשלחת לשום מקום</p>
          </div>
        </div>`;
      return;
    }

    const selected = importDraft.shots.reduce((n, s) => n + s.rows.filter(r => r.include).length, 0);
    const flagged = "border-amber-500 bg-amber-950/40";
    const shotsHTML = importDraft.shots.map((shot, si) => {
      const yearOptions = [0, 1, 2, 3, 4, 5].map(i =>
        `<option value="${i}" ${i === shot.yearIndex ? "selected" : ""}>${esc(ordinalYearName(i))}</option>`).join("");
      const termOptions = [0, 1, 2].map(i =>
        `<option value="${i}" ${i === shot.termIndex ? "selected" : ""}>${esc(nextSemesterName(i))}</option>`).join("");
      const detected = shot.calYear
        ? `זוהה: ${shot.calYear} סמסטר ${TERMS[shot.termIndex]}`
        : `<span class="text-amber-300">לא זוהתה כותרת — בחרו שנה וסמסטר</span>`;
      const rowsHTML = shot.rows.length ? shot.rows.map((r, ri) => `
        <div class="bg-panel2 border border-line rounded-xl p-3 ${r.include ? "" : "opacity-50"}">
          <div class="flex items-center gap-2">
            <input type="checkbox" data-imp="include" data-shot="${si}" data-row="${ri}" ${r.include ? "checked" : ""} class="w-4 h-4 shrink-0" aria-label="לייבא את הקורס" />
            <input type="text" data-imp="name" data-shot="${si}" data-row="${ri}" value="${esc(r.name)}"
              class="flex-1 min-w-0 bg-panel border ${r.flags.name ? flagged : "border-line"} rounded-lg px-2 py-1.5 text-sm" />
          </div>
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-2 text-xs text-muted">
            <label class="flex items-center gap-1.5">ציון
              <input type="number" inputmode="decimal" data-imp="grade" data-shot="${si}" data-row="${ri}" value="${r.grade}" ${r.isBinary ? "disabled" : ""}
                class="w-16 bg-panel border ${r.flags.grade ? flagged : "border-line"} rounded-lg px-2 py-1 font-mono text-ink2 disabled:opacity-40" />
            </label>
            <label class="flex items-center gap-1.5">נק"ז
              <input type="number" inputmode="decimal" step="0.5" data-imp="credits" data-shot="${si}" data-row="${ri}" value="${r.credits}"
                class="w-14 bg-panel border ${r.flags.credits ? flagged : "border-line"} rounded-lg px-2 py-1 font-mono text-ink2" />
            </label>
            <label class="flex items-center gap-1.5">
              <input type="checkbox" data-imp="binary" data-shot="${si}" data-row="${ri}" ${r.isBinary ? "checked" : ""} /> עובר (בינארי)
            </label>
            ${r.duplicate ? `<span class="text-amber-300">כבר קיים בסמסטר</span>` : ""}
            ${r.credits === 0 && !r.duplicate ? `<span>0 נק"ז — דילגנו כברירת מחדל</span>` : ""}
          </div>
        </div>`).join("")
        : `<p class="text-sm text-amber-300">לא נמצאו קורסים בצילום הזה. זה צילום של מסך הציונים באפליקציה של BGU?</p>`;
      return `
        <section class="bg-panel border border-line rounded-2xl p-4">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <p class="text-sm text-ink2 font-semibold">צילום ${si + 1} <span class="text-muted font-normal">· ${detected}</span></p>
            <div class="flex items-center gap-2">
              <select data-imp="year" data-shot="${si}" class="bg-panel2 border border-line rounded-lg px-2 py-1 text-sm">${yearOptions}</select>
              <select data-imp="term" data-shot="${si}" class="bg-panel2 border border-line rounded-lg px-2 py-1 text-sm">${termOptions}</select>
            </div>
          </div>
          <div class="space-y-2">${rowsHTML}</div>
        </section>`;
    }).join("");

    root.innerHTML = `
      <div class="max-w-2xl mx-auto p-4 pb-28">
        <h2 class="text-lg font-bold text-ink2">בדיקה לפני ייבוא</h2>
        <p class="text-sm text-muted mt-1 mb-4">זיהוי טקסט לא מושלם — עברו על הערכים. שדות <span class="text-amber-300">בצהוב</span> לא זוהו בוודאות.</p>
        <div class="space-y-4">${shotsHTML}</div>
      </div>
      <div class="fixed bottom-0 inset-x-0 bg-ink/95 border-t border-line p-3">
        <div class="max-w-2xl mx-auto flex gap-2">
          <button data-action="import-confirm" class="flex-1 text-sm font-semibold bg-accent text-[#07231d] rounded-xl px-4 py-2.5 hover:opacity-90 transition-opacity" ${selected ? "" : "disabled"}>
            ייבוא ${selected} קורסים
          </button>
          <button data-action="import-cancel" class="text-sm font-medium text-muted border border-line rounded-xl px-4 py-2.5 hover:text-ink2">ביטול</button>
        </div>
      </div>`;
  }

  // Typing in the review table updates importDraft in place WITHOUT re-rendering,
  // so the focused input keeps its cursor (same rule as updateComputedOnly()).
  // Only checkboxes/selects re-render, since they don't hold a text cursor.
  function handleImportField(e) {
    const field = e.target.getAttribute && e.target.getAttribute("data-imp");
    if (!field || !importDraft) return;
    const shot = importDraft.shots[Number(e.target.getAttribute("data-shot"))];
    const row = shot && shot.rows[Number(e.target.getAttribute("data-row"))];
    const numOrEmpty = v => (v === "" ? "" : Number(v));

    if (e.type === "input") {
      if (field === "name") row.name = e.target.value;
      if (field === "grade") { row.grade = numOrEmpty(e.target.value); row.flags.grade = false; }
      if (field === "credits") { row.credits = numOrEmpty(e.target.value); row.flags.credits = false; }
      return;
    }
    if (field === "include") row.include = e.target.checked;
    else if (field === "binary") row.isBinary = e.target.checked;
    else if (field === "year" || field === "term") {
      if (field === "year") shot.yearIndex = Number(e.target.value);
      else shot.termIndex = Number(e.target.value);
      markDuplicates(shot);
    } else return;
    renderImportModal();
  }

  /* ============================================================
     CALCULATIONS
  ============================================================ */
  function num(v) {
    const n = Number(v);
    return isFinite(n) ? n : 0;
  }

  function weightSum(components) {
    return components.reduce((s, c) => s + num(c.weight), 0);
  }

  // Returns { grade, valid, status, reason, totalWeight, droppedIds }
  function computeCourseGrade(course) {
    if (course.isBinary) {
      return { grade: null, valid: true, status: "binary" };
    }
    const comps = course.components || [];
    if (comps.length === 0) {
      return { grade: null, valid: false, status: "invalid", reason: "no-components" };
    }
    const totalWeight = weightSum(comps);
    if (Math.abs(totalWeight - 100) > 0.01) {
      return { grade: null, valid: false, status: "invalid", reason: "weight-mismatch", totalWeight };
    }
    const hasUngraded = comps.some(c => num(c.weight) > 0 && (c.grade === "" || c.grade === null || c.grade === undefined));
    if (hasUngraded) {
      return { grade: null, valid: true, status: "ungraded", totalWeight };
    }

    // anchor = the final exam (type "exam" is never Magen-eligible) with the highest
    // weight — this is the grade that quizzes/assignments marked as Magen protect against
    const exams = comps.filter(c => c.type === "exam");
    const anchor = exams.length
      ? exams.reduce((a, b) => (num(b.weight) > num(a.weight) ? b : a))
      : null;

    const droppedIds = [];
    let active = comps.filter(c => {
      if (anchor && (c.type === "quiz" || c.type === "assignment") && c.isMagen) {
        const magenGrade = num(c.grade);
        const anchorGrade = num(anchor.grade);
        if (magenGrade > anchorGrade) return true;
        droppedIds.push(c.id);
        return false;
      }
      return true;
    });

    const droppedWeight = comps
      .filter(c => droppedIds.includes(c.id))
      .reduce((s, c) => s + num(c.weight), 0);
    const remainingWeight = active.reduce((s, c) => s + num(c.weight), 0);

    const withEffective = active.map(c => {
      let effectiveWeight = num(c.weight);
      if (droppedWeight > 0 && remainingWeight > 0) {
        effectiveWeight += droppedWeight * (num(c.weight) / remainingWeight);
      }
      return { ...c, effectiveWeight };
    });

    const weightedSum = withEffective.reduce(
      (s, c) => s + (c.effectiveWeight / 100) * num(c.grade), 0
    );
    const rawGrade = weightedSum + num(course.bonusPoints);
    const grade = Math.min(100, Math.max(0, rawGrade));

    return { grade, valid: true, status: "numeric", totalWeight, droppedIds, rawGrade };
  }

  // Weighted average by credits over a flat course list
  function computeStats(courseList) {
    let weightedSum = 0, gpaCredits = 0, totalCredits = 0, excludedBinaryCredits = 0, invalidCount = 0;
    courseList.forEach(course => {
      const credits = num(course.credits);
      totalCredits += credits;
      const result = computeCourseGrade(course);
      if (course.isBinary) {
        excludedBinaryCredits += credits;
      } else if (result.valid && result.grade !== null) {
        weightedSum += result.grade * credits;
        gpaCredits += credits;
      } else if (!result.valid) {
        invalidCount++;
      }
    });
    return {
      gpa: gpaCredits > 0 ? weightedSum / gpaCredits : null,
      weightedSum,
      totalCredits,
      gpaCredits,
      excludedBinaryCredits,
      invalidCount,
      courseCount: courseList.length
    };
  }

  function semesterStats(semester) { return computeStats(semester ? semester.courses : []); }
  function yearStats(year) { return computeStats(year ? year.semesters.flatMap(s => s.courses) : []); }
  function cumulativeStats() { return computeStats(allCourses()); }

  // Simulates marking each eligible numeric course as binary (pass/fail) one at a
  // time, and returns the single swap that would raise the cumulative GPA the most
  // — i.e. the course dragging the overall average down hardest relative to its
  // credit weight. Returns null if no course, or no swap, would help.
  function recommendBinarySwap() {
    const cumulative = cumulativeStats();
    if (cumulative.gpa === null) return null;
    let best = null;
    allCourses().forEach(course => {
      if (course.isBinary) return;
      const result = computeCourseGrade(course);
      if (!result.valid || result.grade === null) return;
      const credits = num(course.credits);
      if (credits <= 0) return;
      const newGpaCredits = cumulative.gpaCredits - credits;
      if (newGpaCredits <= 0) return;
      const newGpa = (cumulative.weightedSum - result.grade * credits) / newGpaCredits;
      const delta = newGpa - cumulative.gpa;
      if (delta > 0.005 && (!best || delta > best.delta)) {
        best = { course, delta, newGpa, currentGpa: cumulative.gpa };
      }
    });
    return best;
  }

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fmt(n, digits) {
    if (n === null || n === undefined || !isFinite(n)) return "—";
    return n.toFixed(digits === undefined ? 2 : digits);
  }

  function gradeColorClasses(grade) {
    if (grade === null || grade === undefined) return "bg-panel2 text-muted border-line";
    if (grade >= 90) return "bg-accentBg text-accent border-accent/30";
    if (grade >= 80) return "bg-blue-950 text-blue-300 border-blue-800/50";
    if (grade >= 70) return "bg-amber-950 text-amber-300 border-amber-800/50";
    if (grade >= 60) return "bg-orange-950 text-orange-300 border-orange-800/50";
    return "bg-red-950 text-red-300 border-red-800/50";
  }

  function courseGradeBadgeHTML(course) {
    const result = computeCourseGrade(course);
    if (course.isBinary) {
      return `<span class="px-2.5 py-1 rounded-lg text-xs font-bold border bg-purple-950 text-purple-300 border-purple-800/50 whitespace-nowrap">בינארי · עובר</span>`;
    }
    if (!result.valid) {
      if (result.reason === "weight-mismatch") {
        return `<span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold border bg-amber-950 text-amber-300 border-amber-800/50 whitespace-nowrap" title="סה&quot;כ המשקלים חייב להיות 100%">משקלים ${fmt(result.totalWeight, 0)}%</span>`;
      }
      return `<span class="px-2.5 py-1 rounded-lg text-xs font-bold border bg-panel2 text-muted border-line whitespace-nowrap">אין רכיבים</span>`;
    }
    return `<span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold border ${gradeColorClasses(result.grade)} whitespace-nowrap">${fmt(result.grade, 1)}</span>`;
  }

  /* ---------- Dashboard ---------- */
  function renderDashboard() {
    const cumulative = cumulativeStats();
    let semesterCard = { label: "ממוצע סמסטריאלי", sub: "בחרו סמסטר בסינון", stats: null };
    let yearCard = { label: "ממוצע שנתי", sub: "בחרו שנה בסינון", stats: null };

    if (state.filter.mode === "semester") {
      const { year, semester } = locateSemester(state.filter.semesterId);
      if (semester) {
        semesterCard = { label: "ממוצע סמסטריאלי", sub: semester.name, stats: semesterStats(semester) };
        yearCard = { label: "ממוצע שנתי", sub: year.name, stats: yearStats(year) };
      }
    } else if (state.filter.mode === "year") {
      const year = findYear(state.filter.yearId);
      if (year) yearCard = { label: "ממוצע שנתי", sub: year.name, stats: yearStats(year) };
    }

    const cards = [
      statCardHTML(semesterCard.label, semesterCard.sub, semesterCard.stats),
      statCardHTML(yearCard.label, yearCard.sub, yearCard.stats),
      statCardHTML("ממוצע מצטבר כללי", "כל התואר", cumulative),
      creditsCardHTML(cumulative)
    ];
    document.getElementById("dashboard").innerHTML = cards.join("");
  }

  function statCardHTML(label, sub, stats) {
    const value = stats && stats.gpa !== null ? fmt(stats.gpa, 2) : "—";
    const note = stats && stats.excludedBinaryCredits > 0
      ? `<p class="text-[11px] text-muted mt-1">${fmt(stats.excludedBinaryCredits, 0)} נק&quot;ז בינאריות לא נכללות</p>`
      : "";
    return `
      <div class="bg-panel border border-line rounded-xl p-4 sm:p-5">
        <p class="text-xs sm:text-sm font-semibold text-muted">${esc(label)}</p>
        <p class="text-[11px] text-muted/70 mb-1 truncate">${esc(sub)}</p>
        <p class="text-2xl sm:text-3xl font-bold font-mono text-accent">${value}</p>
        ${note}
      </div>`;
  }

  function creditsCardHTML(cumulative) {
    return `
      <div class="bg-panel border border-line rounded-xl p-4 sm:p-5">
        <p class="text-xs sm:text-sm font-semibold text-muted">סך נק&quot;ז שנצברו</p>
        <p class="text-[11px] text-muted/70 mb-1">כל התואר</p>
        <p class="text-2xl sm:text-3xl font-bold font-mono text-ink2">${fmt(cumulative.totalCredits, 0)}</p>
        ${cumulative.invalidCount > 0 ? `<p class="text-[11px] text-red-400 mt-1">${cumulative.invalidCount} קורסים עם משקלים לא תקינים</p>` : ""}
      </div>`;
  }

  /* ---------- Binary recommendation ---------- */
  function renderRecommendation() {
    const el = document.getElementById("recommendation");
    const best = recommendBinarySwap();
    if (!best) {
      el.innerHTML = "";
      return;
    }
    const { course, currentGpa, newGpa, delta } = best;
    const { year, semester } = locateCourse(course.id);
    const where = year && semester ? `${esc(semester.name)} · ${esc(year.name)}` : "";
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 bg-accentBg border border-accent/30 rounded-xl px-4 py-3">
        <p class="text-sm text-ink2">
          <span class="text-accent font-semibold">טיפ:</span>
          סימון הקורס <span class="font-semibold">"${esc(course.name)}"</span>${where ? ` (${where})` : ""} כעובר בינארי צפוי להעלות את הממוצע המצטבר
          מ-<span class="font-mono text-accent">${fmt(currentGpa, 2)}</span>
          ל-<span class="font-mono text-accent">${fmt(newGpa, 2)}</span>
          <span class="font-mono text-accent">(+${fmt(delta, 2)})</span>
        </p>
        <button data-action="apply-recommendation" data-course-id="${course.id}" class="shrink-0 text-xs font-semibold bg-accent text-[#07231d] rounded-lg px-3 py-1.5 hover:opacity-90 transition-opacity">
          סמן כעובר בינארי
        </button>
      </div>`;
  }

  /* ---------- Filter bar ---------- */
  function renderFilterBar() {
    const allActive = state.filter.mode === "all";
    let html = `<div class="flex flex-wrap items-center gap-2">
      <button data-action="filter-all" class="chip ${allActive ? "chip-active" : ""} px-4 py-1.5 rounded-full text-sm font-semibold border border-line bg-panel text-muted hover:border-accent/50 transition-colors">
        כל התואר
      </button>`;

    state.years.forEach(year => {
      const active = state.filter.mode !== "all" && state.filter.yearId === year.id;
      html += `<button data-action="filter-year" data-year-id="${year.id}" class="chip ${active ? "chip-active" : ""} px-4 py-1.5 rounded-full text-sm font-semibold border border-line bg-panel text-muted hover:border-accent/50 transition-colors">
        ${esc(year.name)}
      </button>`;
    });
    html += `</div>`;

    if (state.filter.mode !== "all" && state.filter.yearId) {
      const year = findYear(state.filter.yearId);
      if (year && year.semesters.length) {
        html += `<div class="flex flex-wrap items-center gap-2 mt-2">
          <span class="text-xs text-muted font-medium">סמסטרים:</span>`;
        year.semesters.forEach(sem => {
          const active = state.filter.mode === "semester" && state.filter.semesterId === sem.id;
          html += `<button data-action="filter-semester" data-year-id="${year.id}" data-semester-id="${sem.id}" class="chip ${active ? "chip-active" : ""} px-3 py-1 rounded-full text-xs font-semibold border border-line bg-panel text-muted hover:border-accent/50 transition-colors">
            ${esc(sem.name)}
          </button>`;
        });
        html += `</div>`;
      }
    }

    document.getElementById("filter-bar").innerHTML = html;
  }

  /* ---------- Course tree ---------- */
  function visibleYears() {
    if (state.filter.mode === "all") return state.years;
    if (state.filter.mode === "year" || state.filter.mode === "semester") {
      const y = findYear(state.filter.yearId);
      return y ? [y] : [];
    }
    return state.years;
  }

  function visibleSemesters(year) {
    if (state.filter.mode === "semester") {
      return year.semesters.filter(s => s.id === state.filter.semesterId);
    }
    return year.semesters;
  }

  function renderYearsRoot() {
    const years = visibleYears();
    const root = document.getElementById("years-root");
    if (state.years.length === 0) {
      root.innerHTML = `
        <div class="text-center py-16 border-2 border-dashed border-line rounded-2xl bg-panel/40">
          <p class="text-muted font-medium">עדיין לא נוספו שנות לימוד</p>
          <p class="text-muted/60 text-sm mt-1">לחצו על "הוספת שנת לימודים" למטה כדי להתחיל</p>
          <div class="mt-5 flex flex-wrap justify-center gap-2">
            <button data-action="load-demo" class="text-sm font-semibold bg-accent text-[#07231d] rounded-xl px-4 py-2 hover:opacity-90 transition-opacity">
              טען נתוני דמו
            </button>
            <button data-action="import-screenshot" class="text-sm font-semibold text-accent border border-accent/50 hover:bg-accentBg/40 rounded-xl px-4 py-2 transition-colors">
              ייבוא מצילום מסך
            </button>
          </div>
          <p class="text-muted/60 text-xs mt-2">הדמו הוא נתונים פיקטיביים · הייבוא קורא צילום של מסך הציונים באפליקציית BGU</p>
        </div>`;
      return;
    }
    if (years.length === 0) {
      root.innerHTML = `<div class="text-center py-10 text-muted text-sm">אין תוצאות עבור הסינון הנוכחי</div>`;
      return;
    }
    root.innerHTML = years.map(renderYearBlock).join("");
  }

  function renderYearBlock(year) {
    const stats = yearStats(year);
    const semesters = visibleSemesters(year);
    return `
      <section class="bg-panel rounded-2xl border border-line overflow-hidden">
        <div class="flex items-center justify-between gap-3 px-4 sm:px-5 py-3 bg-panel2 border-b border-line">
          <div class="flex items-center gap-2">
            <h2 class="font-bold text-ink2 text-base sm:text-lg">${esc(year.name)}</h2>
            <span class="text-xs text-muted font-mono" data-year-summary="${year.id}">ממוצע שנתי: ${stats.gpa !== null ? fmt(stats.gpa, 2) : "—"} · ${fmt(stats.totalCredits, 0)} נק&quot;ז</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button data-action="add-semester" data-year-id="${year.id}" class="text-xs font-semibold text-accent hover:opacity-80 hover:bg-accentBg/50 rounded-lg px-2.5 py-1.5 transition-colors">+ סמסטר</button>
            <button data-action="delete-year" data-year-id="${year.id}" class="text-muted hover:text-red-400 rounded-lg px-2 py-1.5 transition-colors" title="מחיקת שנה">✕</button>
          </div>
        </div>
        <div class="p-3 sm:p-4 space-y-4">
          ${semesters.length ? semesters.map(renderSemesterBlock).join("") : `<p class="text-center text-muted/60 text-sm py-6">אין סמסטרים בשנה זו</p>`}
        </div>
      </section>`;
  }

  function renderSemesterBlock(semester) {
    const stats = semesterStats(semester);
    return `
      <div class="rounded-xl border border-line bg-panel2/60">
        <div class="flex items-center justify-between gap-3 px-3 sm:px-4 py-2.5">
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-semibold text-ink2 text-sm sm:text-base">${esc(semester.name)}</h3>
            <span class="text-xs text-muted font-mono" data-semester-summary="${semester.id}">ממוצע: ${stats.gpa !== null ? fmt(stats.gpa, 2) : "—"} · ${fmt(stats.totalCredits, 0)} נק&quot;ז</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button data-action="add-course" data-semester-id="${semester.id}" class="text-xs font-semibold text-accent hover:opacity-80 hover:bg-accentBg/50 rounded-lg px-2.5 py-1.5 transition-colors">+ קורס</button>
            <button data-action="delete-semester" data-semester-id="${semester.id}" class="text-muted hover:text-red-400 rounded-lg px-2 py-1.5 transition-colors" title="מחיקת סמסטר">✕</button>
          </div>
        </div>
        <div class="px-3 sm:px-4 pb-3 sm:pb-4 space-y-2.5">
          ${semester.courses.length ? semester.courses.map(renderCourseCard).join("") : `<p class="text-center text-muted/60 text-xs py-4">אין קורסים בסמסטר זה</p>`}
        </div>
      </div>`;
  }

  function renderCourseCard(course) {
    const result = computeCourseGrade(course);
    const badge = courseGradeBadgeHTML(course);
    return `
      <div class="bg-panel rounded-xl border border-line" data-course-card="${course.id}">
        <div class="px-3 sm:px-4 py-3">
          <div class="flex items-center gap-2 sm:gap-3">
            <button data-action="toggle-expand" data-course-id="${course.id}" class="text-muted hover:text-ink2 shrink-0 transition-transform ${course.expanded ? "rotate-90" : ""}">▶</button>
            <input type="text" value="${esc(course.name)}" data-field="course-name" data-course-id="${course.id}"
              class="flex-1 min-w-0 font-semibold text-ink2 text-sm sm:text-base bg-transparent border-0 focus:ring-2 focus:ring-accent/40 rounded-lg px-2 py-1" />
            <button data-action="delete-course" data-course-id="${course.id}" class="text-muted hover:text-red-400 shrink-0 px-1 transition-colors" title="מחיקת קורס">✕</button>
          </div>
          <div class="flex flex-wrap items-center justify-end gap-2 mt-2">
            <label class="flex items-center gap-1 text-[11px] sm:text-xs text-muted cursor-pointer" title="עובר בינארי - לא נכלל בממוצע המספרי">
              <input type="checkbox" ${course.isBinary ? "checked" : ""} data-field="course-binary" data-course-id="${course.id}" class="rounded">
              בינארי
            </label>
            <div class="flex items-center gap-1">
              <input type="number" min="0" step="0.5" value="${esc(course.credits)}" data-field="course-credits" data-course-id="${course.id}"
                class="w-14 text-center text-sm font-mono bg-panel2 text-ink2 border border-line focus:ring-2 focus:ring-accent/40 rounded-lg px-1 py-1" title="נק&quot;ז" />
              <span class="text-[11px] text-muted">נק&quot;ז</span>
            </div>
            <span data-grade-badge="${course.id}">${badge}</span>
          </div>
        </div>
        ${course.expanded ? renderCourseBody(course, result) : ""}
      </div>`;
  }

  function renderCourseBody(course, result) {
    if (course.isBinary) {
      return `
        <div class="px-4 sm:px-5 pb-4 border-t border-line pt-3">
          <p class="text-xs text-muted">קורס מסומן כ"עובר בינארי" — לא ייכלל בחישוב הממוצע המספרי, אך הנק&quot;ז שלו יצטרפו לסך הנק&quot;ז שנצברו.</p>
        </div>`;
    }

    const exams = course.components.filter(c => c.type === "exam" || c.type === "quiz");
    const assignments = course.components.filter(c => c.type === "assignment");
    const totalWeight = weightSum(course.components);
    const weightOk = Math.abs(totalWeight - 100) <= 0.01;

    return `
      <div class="px-3 sm:px-5 pb-4 border-t border-line pt-3 space-y-4">

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <h4 class="text-xs font-bold text-muted uppercase tracking-wide">מבחנים ובחנים</h4>
            <button data-action="add-component" data-type="quiz" data-course-id="${course.id}" class="text-xs font-semibold text-accent hover:opacity-80">+ הוספת בוחן</button>
          </div>
          <div class="space-y-1.5">
            ${exams.length ? exams.map(c => renderComponentRow(course, c, result)).join("") : `<p class="text-xs text-muted/60">אין רכיבי מבחן</p>`}
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <h4 class="text-xs font-bold text-muted uppercase tracking-wide">עבודות</h4>
            <button data-action="add-component" data-type="assignment" data-course-id="${course.id}" class="text-xs font-semibold text-accent hover:opacity-80">+ הוספת עבודה</button>
          </div>
          <div class="space-y-1.5">
            ${assignments.length ? assignments.map(c => renderComponentRow(course, c, result)).join("") : `<p class="text-xs text-muted/60">אין עבודות</p>`}
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 bg-panel2 rounded-xl px-3 py-2.5">
          <div class="flex items-center gap-2">
            <span data-weight-summary class="text-xs font-mono font-semibold ${weightOk ? "text-accent" : "text-amber-400"}">
              סה&quot;כ משקלים: ${fmt(totalWeight, 0)}%${weightOk ? " ✓" : " (נדרש 100%)"}
            </span>
          </div>
          <label class="flex items-center gap-2 text-xs text-muted">
            בונוס לציון הסופי
            <input type="number" step="0.5" value="${esc(course.bonusPoints)}" data-field="course-bonus" data-course-id="${course.id}"
              class="w-16 text-center font-mono bg-panel text-ink2 border border-line focus:ring-2 focus:ring-accent/40 rounded-lg px-1 py-1" />
          </label>
        </div>

        <p data-dropped-count="${course.id}" class="text-[11px] text-muted ${result.droppedIds && result.droppedIds.length ? "" : "hidden"}">רכיבי מגן שלא שיפרו את הציון ולא נכללו: ${result.droppedIds ? result.droppedIds.length : 0}</p>
      </div>`;
  }

  function renderComponentRow(course, comp, result) {
    const isDropped = result.droppedIds && result.droppedIds.includes(comp.id);
    return `
      <div data-component-row="${comp.id}" class="rounded-lg px-2 py-1.5 ${isDropped ? "bg-panel2 opacity-60" : "bg-panel"} border border-line">
        <div class="flex items-center gap-1.5">
          <input type="text" value="${esc(comp.name)}" data-field="component-name" data-course-id="${course.id}" data-component-id="${comp.id}"
            class="flex-1 min-w-0 text-sm text-ink2 bg-transparent border-0 focus:ring-2 focus:ring-accent/40 rounded-md px-1.5 py-1" />
          <button data-action="delete-component" data-course-id="${course.id}" data-component-id="${comp.id}" class="text-muted hover:text-red-400 px-1 shrink-0">✕</button>
        </div>
        <div class="flex flex-wrap items-center gap-3 mt-1 px-1.5">
          <div>
            <div class="text-[10px] text-muted mb-0.5">משקל</div>
            <div class="flex items-center gap-1">
              <input type="number" min="0" max="100" step="1" value="${esc(comp.weight)}" data-field="component-weight" data-course-id="${course.id}" data-component-id="${comp.id}"
                class="w-14 text-center text-sm font-mono bg-panel2 text-ink2 border border-line focus:ring-2 focus:ring-accent/40 rounded-md px-1 py-1" title="משקל %" />
              <span class="text-[10px] text-muted">%</span>
            </div>
          </div>
          <div>
            <div class="text-[10px] text-muted mb-0.5">ציון</div>
            <input type="number" min="0" max="100" step="0.5" value="${esc(comp.grade)}" data-field="component-grade" data-course-id="${course.id}" data-component-id="${comp.id}"
              class="w-14 text-center text-sm font-mono bg-panel2 text-ink2 border border-line focus:ring-2 focus:ring-accent/40 rounded-md px-1 py-1" title="ציון" />
          </div>
          ${comp.type === "quiz" || comp.type === "assignment" ? `
            <label class="flex items-center gap-1 text-[11px] text-muted cursor-pointer whitespace-nowrap self-end pb-1.5" title="מגן - נספק בממוצע רק אם ציונו גבוה מהמבחן הסופי">
              <input type="checkbox" ${comp.isMagen ? "checked" : ""} data-field="component-magen" data-course-id="${course.id}" data-component-id="${comp.id}" class="rounded">
              מגן
            </label>` : ""}
          ${comp.type === "quiz" || comp.type === "assignment" ? `<span data-dropped-label class="text-[10px] text-muted whitespace-nowrap self-end pb-1.5 ${isDropped ? "" : "hidden"}">לא נכלל</span>` : ""}
        </div>
      </div>`;
  }

  /* ============================================================
     FULL RENDER + LIGHTWEIGHT UPDATE
  ============================================================ */
  function render() {
    persistState();
    renderDashboard();
    renderRecommendation();
    renderFilterBar();
    renderYearsRoot();
  }

  // Called on every keystroke in a grade/weight/credits/bonus field:
  // updates state (already done by caller) and refreshes only computed numbers,
  // so the focused input never loses focus/cursor position.
  function updateComputedOnly() {
    persistState();
    document.querySelectorAll("[data-grade-badge]").forEach(el => {
      const courseId = el.getAttribute("data-grade-badge");
      const { course } = locateCourse(courseId);
      if (course) el.innerHTML = courseGradeBadgeHTML(course);
    });
    document.querySelectorAll("[data-course-card]").forEach(el => {
      const courseId = el.getAttribute("data-course-card");
      const { course } = locateCourse(courseId);
      if (!course || course.isBinary) return;
      const result = computeCourseGrade(course);
      const totalWeight = weightSum(course.components);
      const weightOk = Math.abs(totalWeight - 100) <= 0.01;
      const weightLabel = el.querySelector("[data-weight-summary]");
      if (weightLabel) {
        weightLabel.textContent = `סה"כ משקלים: ${fmt(totalWeight, 0)}%${weightOk ? " ✓" : " (נדרש 100%)"}`;
        weightLabel.className = `text-xs font-mono font-semibold ${weightOk ? "text-accent" : "text-amber-400"}`;
      }

      const droppedIds = result.droppedIds || [];
      course.components.forEach(comp => {
        const row = el.querySelector(`[data-component-row="${comp.id}"]`);
        if (!row) return;
        const isDropped = droppedIds.includes(comp.id);
        row.className = `rounded-lg px-2 py-1.5 ${isDropped ? "bg-panel2 opacity-60" : "bg-panel"} border border-line`;
        const label = row.querySelector("[data-dropped-label]");
        if (label) label.classList.toggle("hidden", !isDropped);
      });

      const droppedCount = el.querySelector(`[data-dropped-count="${course.id}"]`);
      if (droppedCount) {
        droppedCount.textContent = `רכיבי מגן שלא שיפרו את הציון ולא נכללו: ${droppedIds.length}`;
        droppedCount.classList.toggle("hidden", droppedIds.length === 0);
      }
    });
    renderDashboard();
    renderRecommendation();
    renderFilterBarSummaries();
  }

  function renderFilterBarSummaries() {
    // Filter bar chip labels don't show numbers themselves; year/semester summaries
    // live inside course tree headers, so just refresh those in place.
    document.querySelectorAll("[data-year-summary]").forEach(el => {
      const yearId = el.getAttribute("data-year-summary");
      const year = findYear(yearId);
      if (year) {
        const stats = yearStats(year);
        el.textContent = `ממוצע שנתי: ${stats.gpa !== null ? fmt(stats.gpa, 2) : "—"} · ${fmt(stats.totalCredits, 0)} נק"ז`;
      }
    });
    document.querySelectorAll("[data-semester-summary]").forEach(el => {
      const semId = el.getAttribute("data-semester-summary");
      const { semester } = locateSemester(semId);
      if (semester) {
        const stats = semesterStats(semester);
        el.textContent = `ממוצע: ${stats.gpa !== null ? fmt(stats.gpa, 2) : "—"} · ${fmt(stats.totalCredits, 0)} נק"ז`;
      }
    });
  }

  /* ============================================================
     TOAST
  ============================================================ */
  function showToast(msg) {
    const root = document.getElementById("toast-root");
    const el = document.createElement("div");
    el.className = "fade-in pointer-events-auto bg-panel border border-line text-ink2 text-sm font-medium px-4 py-2 rounded-xl";
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.remove(); }, 2200);
  }

  /* ============================================================
     EVENT DELEGATION
  ============================================================ */
  // Select all text on focus for number fields, so typing a new value never
  // concatenates with what was already there (e.g. clicking a "0" field and
  // typing "20" would otherwise leave "020").
  document.addEventListener("focus", function (e) {
    if (e.target.matches && e.target.matches('input[type="number"][data-field]')) {
      e.target.select();
    }
  }, true);

  document.getElementById("import-file-input").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    if (file) importBackupFile(file);
    e.target.value = ""; // allow re-importing the same filename later
  });

  document.getElementById("screenshot-input").addEventListener("change", function (e) {
    const files = Array.from(e.target.files || []);
    e.target.value = ""; // allow picking the same screenshot again
    startScreenshotImport(files);
  });

  // The review modal has its own fields (data-imp), separate from the main
  // data-field listeners below, which ignore anything without data-field.
  document.addEventListener("input", handleImportField);
  document.addEventListener("change", handleImportField);

  // Extra safety net for mobile browsers: iOS in particular can suspend or kill
  // the tab process without warning when the app is backgrounded, so force a
  // save on every signal that the page might be about to disappear — not just
  // on the "beforeunload" a desktop browser would reliably fire.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") persistState();
  });
  window.addEventListener("pagehide", persistState);

  document.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");
    const courseId = btn.getAttribute("data-course-id");
    const semesterId = btn.getAttribute("data-semester-id");
    const yearId = btn.getAttribute("data-year-id");
    const componentId = btn.getAttribute("data-component-id");
    const type = btn.getAttribute("data-type");

    switch (action) {
      case "add-year": addYear(); break;
      case "delete-year": deleteYear(yearId); break;
      case "add-semester": addSemester(yearId); break;
      case "delete-semester": deleteSemester(semesterId); break;
      case "add-course": addCourse(semesterId); break;
      case "delete-course": deleteCourse(courseId); break;
      case "toggle-expand": toggleCourseExpanded(courseId); break;
      case "add-component": addComponent(courseId, type); break;
      case "delete-component": deleteComponent(courseId, componentId); break;
      case "reset-all": resetAll(); break;
      case "apply-recommendation": applyRecommendation(courseId); break;
      case "load-demo": loadDemoData(); break;
      case "import-screenshot": document.getElementById("screenshot-input").click(); break;
      case "import-confirm": confirmScreenshotImport(); break;
      case "import-cancel": closeImportModal(); break;
      case "dismiss-inapp": document.getElementById("inapp-warning").classList.add("hidden"); break;
      case "export-backup": exportBackup(); break;
      case "import-backup": document.getElementById("import-file-input").click(); break;
      case "filter-all":
        state.filter = { mode: "all", yearId: null, semesterId: null };
        render();
        break;
      case "filter-year":
        state.filter = { mode: "year", yearId, semesterId: null };
        render();
        break;
      case "filter-semester":
        state.filter = { mode: "semester", yearId, semesterId };
        render();
        break;
    }
  });

  document.addEventListener("input", function (e) {
    const field = e.target.getAttribute && e.target.getAttribute("data-field");
    if (!field) return;
    const courseId = e.target.getAttribute("data-course-id");
    const componentId = e.target.getAttribute("data-component-id");

    if (field === "course-name") {
      const { course } = locateCourse(courseId);
      if (course) course.name = e.target.value;
      persistState();
      return; // no computed values depend on the name
    }
    if (field === "course-credits") {
      const { course } = locateCourse(courseId);
      if (course) course.credits = clampNumber(e.target.value, 0, 999);
      updateComputedOnly();
      return;
    }
    if (field === "course-bonus") {
      const { course } = locateCourse(courseId);
      if (course) course.bonusPoints = clampNumber(e.target.value, -100, 100);
      updateComputedOnly();
      return;
    }
    if (field === "component-name") {
      const { course } = locateCourse(courseId);
      const comp = course && course.components.find(c => c.id === componentId);
      if (comp) comp.name = e.target.value;
      persistState();
      return;
    }
    if (field === "component-weight") {
      const { course } = locateCourse(courseId);
      const comp = course && course.components.find(c => c.id === componentId);
      if (comp) comp.weight = clampNumber(e.target.value, 0, 100);
      updateComputedOnly();
      return;
    }
    if (field === "component-grade") {
      const { course } = locateCourse(courseId);
      const comp = course && course.components.find(c => c.id === componentId);
      if (comp) comp.grade = clampNumber(e.target.value, 0, 100);
      updateComputedOnly();
      return;
    }
  });

  document.addEventListener("change", function (e) {
    const field = e.target.getAttribute && e.target.getAttribute("data-field");
    if (!field) return;
    const courseId = e.target.getAttribute("data-course-id");
    const componentId = e.target.getAttribute("data-component-id");

    if (field === "course-binary") {
      const { course } = locateCourse(courseId);
      if (course) course.isBinary = e.target.checked;
      render();
      return;
    }
    if (field === "component-magen") {
      const { course } = locateCourse(courseId);
      const comp = course && course.components.find(c => c.id === componentId);
      if (comp) comp.isMagen = e.target.checked;
      render();
      return;
    }
    // Grade/weight/credits/bonus are already fully reflected (including per-row
    // Magen styling) by updateComputedOnly() on every keystroke via the "input"
    // handler above — no additional work needed on blur. Deliberately NOT calling
    // render() here: a full re-render on blur would destroy and recreate the input
    // the user just clicked into, silently swallowing their next keystrokes.
  });

  function clampNumber(raw, min, max) {
    if (raw === "" || raw === null || raw === undefined) return "";
    let n = Number(raw);
    if (!isFinite(n)) return "";
    if (n < min) n = min;
    if (n > max) n = max;
    return n;
  }

  /* ============================================================
     INIT
  ============================================================ */
  // Links opened from inside apps (Instagram, Facebook, TikTok, LinkedIn,
  // WhatsApp…) load in an embedded browser whose storage is often wiped when
  // it closes — friends reported re-typing all their courses on every visit.
  // We can't fix their storage, so we detect the common in-app browsers by
  // their user-agent string and suggest opening the link in Safari/Chrome.
  function checkInAppBrowser() {
    const ua = navigator.userAgent || "";
    if (/Instagram|FBAN|FBAV|FB_IAB|Messenger|WhatsApp|LinkedInApp|Snapchat|musical_ly|BytedanceWebview|TikTok|Line\//i.test(ua)) {
      document.getElementById("inapp-warning").classList.remove("hidden");
    }
  }

  // Ask the browser to treat our storage as "persistent" so it isn't evicted
  // under storage pressure. Supported in Chrome/Edge/Firefox (Safari may
  // ignore it) — harmless where unsupported, and the JSON backup still exists.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  const restored = loadPersistedState();
  render();
  checkInAppBrowser();
  if (restored) showToast("הנתונים שוחזרו מהדפדפן");
})();
</script>
</body>
</html>
